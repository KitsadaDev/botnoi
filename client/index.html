<html lang="th">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plasom - ระบบแจ้งซ่อมและติดตามสถานะแอร์ครบวงจร</title>

    <!-- Google Fonts: Prompt (Thai Modern Sans) + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
        <!-- =========================== -->
    <!-- Botnoi AI Customer Chat Widget (Plasom) -->
    <!-- =========================== -->
    <div id="bn-root"></div>
    <script>
      window.addEventListener('load', function () {
        if (window.BN) {
          window.BN.init({ version: '1.0' });
        }
      });
    </script>
    <script>
      (function (d, s, id) {
        var js,
          bjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = 'https://console.botnoi.ai/customerchat/index.js';
        bjs.parentNode.insertBefore(js, bjs);
      })(document, 'script', 'bn-jssdk');
    </script>
    <div
      class="bn-customerchat"
      bot_id="6af1990838450ceff91278ac"
      bot_logo=""
      bot_name="Plasom AI Assistant"
      theme_color="#ea580c"
      locale="th"
      logged_in_greeting="สวัสดีค่ะ! น้อง Plasom ยินดีให้บริการ ปรึกษาอาการเสียหรือแจ้งซ่อมได้เลยนะคะ"
      greeting_message="สวัสดีค่ะ แจ้งอาการเสียของอุปกรณ์ หรือพิมพ์รหัสติดตามงานซ่อมได้เลยค่ะ"
      default_open="false"
    ></div>

  </body>
</html>
